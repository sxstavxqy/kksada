<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>📰 新闻模拟器 · 五场景</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.2.1/dist/chartjs-plugin-annotation.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0b0f15; font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: #e0e6ed; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:2rem;
    }
    .dashboard {
      width:100%; max-width:1200px; background:rgba(18,24,34,0.9); backdrop-filter:blur(16px);
      border-radius:2rem; border:1px solid rgba(255,255,255,0.08); box-shadow:0 25px 60px rgba(0,0,0,0.6); padding:2rem;
    }
    .rules-section {
      background: rgba(30, 42, 58, 0.8);
      border-radius: 1rem;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      border-left: 4px solid #4f8cff;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .rules-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #7a8ba0;
      margin-bottom: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .rules-content {
      font-size: 0.85rem;
      line-height: 1.5;
      color: #b8c5d6;
    }
    .rules-list {
      list-style-type: none;
      margin: 0.8rem 0;
    }
    .rules-list li {
      margin-bottom: 0.6rem;
      padding-left: 1.2rem;
      position: relative;
    }
    .rules-list li:before {
      content: "•";
      color: #4f8cff;
      font-size: 1.2rem;
      position: absolute;
      left: 0;
      top: -0.1rem;
    }
    .rules-highlight {
      color: #f0c040;
      font-weight: 600;
    }
    .rules-formula {
      background: rgba(0,0,0,0.2);
      border-radius: 0.5rem;
      padding: 0.6rem 0.8rem;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      margin: 0.8rem 0;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .header { display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap; }
    .logo-icon { font-size:2rem; filter:drop-shadow(0 0 10px #3a7bd5); }
    h1 { font-weight:650; font-size:1.5rem; background:linear-gradient(135deg,#cfdeff,#8baee0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .scene-nav { display:flex; gap:0.5rem; margin-left:auto; }
    .scene-nav button {
      padding:0.5rem 1.2rem; border-radius:2rem; border:1px solid rgba(255,255,255,0.15);
      background:rgba(255,255,255,0.03); color:#aab; font-weight:600; cursor:pointer; transition:0.2s;
    }
    .scene-nav button.active { background:#2d5fcf; border-color:#4f8cff; color:white; }
    .workspace { display:flex; gap:2rem; margin-bottom:2rem; flex-wrap:wrap; }
    .pool { flex:1; background:rgba(255,255,255,0.03); border-radius:1.2rem; padding:1rem; border:1px solid rgba(255,255,255,0.07); }
    .pool-label { font-size:0.75rem; text-transform:uppercase; letter-spacing:1px; color:#7a8ba0; margin-bottom:0.8rem; }
    .news-title { font-size:0.9rem; font-weight:600; margin-bottom:0.8rem; color:#d0d8e8; }
    .news-cards { display:flex; flex-direction:column; gap:0.8rem; }
    .news-card {
      background:#1f2b3b; border:1px solid rgba(255,255,255,0.1); border-radius:1rem; padding:0.8rem 1rem;
      cursor:grab; font-weight:600; display:flex; align-items:center; gap:0.5rem; transition:0.2s;
    }
    .news-card.positive { border-left:4px solid #2ecc71; }
    .news-card.negative { border-left:4px solid #e74c3c; }
    .news-card.neutral { border-left:4px solid #f39c12; }
    .news-card.dragging { opacity:0.5; }
    .publish-area { flex:1.5; display:flex; flex-direction:column; gap:0.8rem; }
    .drop-zone {
      background:rgba(255,255,255,0.02); border:2px dashed rgba(255,255,255,0.2); border-radius:1.2rem;
      padding:0.8rem; min-height:70px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
      gap:0.8rem; transition:0.2s; position:relative;
    }
    .drop-zone.drag-over { border-color:#4f8cff; background:rgba(79,140,255,0.06); }
    .zone-label {
      font-size:0.7rem; color:#7a8ba0; text-transform:uppercase; position:absolute; top:-0.8rem; left:1rem;
      background:#0b0f15; padding:0 0.4rem;
    }
    .slot-row { display:flex; gap:1rem; width:100%; }
    .action-btns { display:flex; gap:0.8rem; margin:1.5rem 0; flex-wrap:wrap; }
    .btn {
      padding:0.7rem 1.6rem; border-radius:2.5rem; font-weight:600; font-size:0.9rem; border:1px solid transparent;
      cursor:pointer; transition:0.2s; background:#1e2a3a; color:#cdddee; display:inline-flex; align-items:center; gap:0.4rem;
    }
    .btn-primary { background:#2d5fcf; border-color:#4f8cff; color:white; box-shadow:0 4px 14px rgba(45,95,207,0.4); }
    .btn-water { background:#c44536; border-color:#f05a4b; color:white; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; pointer-events:none; }
    .charts-row { display:flex; gap:1.5rem; flex-wrap:wrap; }
    .chart-box { flex:1 1 250px; background:rgba(0,0,0,0.25); border-radius:1.2rem; padding:1rem; border:1px solid rgba(255,255,255,0.06); }
    canvas { width:100%; max-height:220px; }
    .dual-bar { display:flex; gap:1rem; }
  </style>
</head>
<body>
<div class="dashboard" id="appRoot">
  <!-- 规则说明区域 -->
  <div class="rules-section">
    <div class="rules-title">📋 模拟器规则说明</div>
    <div class="rules-content">
      <ul class="rules-list">
        <li>一个新闻有一个或多个<strong class="rules-highlight">要点(kernel)</strong>，值为<strong class="rules-highlight">负(-)</strong>、<strong class="rules-highlight">正(+)</strong>或<strong class="rules-highlight">零(0)</strong></li>
        <li>观众遇到要点为<strong class="rules-highlight">正</strong>的新闻就会<strong class="rules-highlight">点赞</strong></li>
        <li>观众遇到要点为<strong class="rules-highlight">负</strong>的新闻就会<strong class="rules-highlight">点踩</strong></li>
        <li>观众遇到要点为<strong class="rules-highlight">0</strong>的新闻有<strong class="rules-highlight">0.5</strong>的概率点赞，<strong class="rules-highlight">0.5</strong>的概率点踩</li>
        <li>要点的<strong class="rules-highlight">绝对值</strong>代表新闻的吸引程度</li>
      </ul>
      
      <div class="rules-formula">
        双新闻选择概率公式：<br>
        新闻A要点绝对值 = a，新闻B要点绝对值 = b<br>
        观众有 a/(a+b) 的概率评论新闻A，b/(a+b) 的概率评论新闻B
      </div>
      
      <div class="rules-formula">
        复合新闻反应概率公式：<br>
        新闻有正要点(绝对值a)和负要点(绝对值b)<br>
        观众评论新闻时有 a/(a+b) 的概率点赞，b/(a+b) 的概率点踩
      </div>
    </div>
  </div>
</div>

<script>
  (() => {
    // ---------- 场景定义 ----------
    const scenes = {
      scene1: {
        title: '🌱 场景1 · 正/中性新闻',
        pool: [
          { kernel: 1, label: '这是一个好新闻', class: 'positive' },
          { kernel: 0, label: '这是一个平平无奇的新闻', class: 'neutral' }
        ],
        totalSteps: 50,
        waterEnabled: false,
        useDragZones: false,
        intervalMs: 100,
        evaluate: (kernel) => {
          if (kernel === 1) return { approve: 1, oppose: 0 };
          return Math.random() < 0.5 ? { approve: 1, oppose: 0 } : { approve: 0, oppose: 1 };
        },
        modeType: 'single'
      },
      scene2: {
        title: '⚠️ 场景2 · 负新闻+水军',
        pool: [
          { kernel: -1, label: '这是一个坏新闻', class: 'negative' }
        ],
        totalSteps: 50,
        waterEnabled: true,
        useDragZones: false,
        intervalMs: 100,
        evaluate: (kernel) => {
          if (kernel === -1) return { approve: 0, oppose: 1 };
          return { approve: 0, oppose: 0 };
        },
        modeType: 'single'
      },
      scene3: {
        title: '🔄 场景3 · 复合内核 (500人)',
        newsTitle: '这是一个建设工厂的新闻',
        pool: [
          { kernel: 1, label: '📈 +1 利好经济', class: 'positive' },
          { kernel: -2, label: '🌧️ -2 环境变差', class: 'negative' }
        ],
        totalSteps: 500,
        waterEnabled: true,
        useDragZones: true,
        intervalMs: 10,
        modeType: 'composite',
        getProb: (mode, step) => {
          if (mode === 'simul') return Math.random() < 1/3;
          if (mode === 'posFirst') return step <= 250 ? true : (Math.random() < 1/3);
          return step <= 250 ? false : (Math.random() < 1/3);
        }
      },
      scene3_1: {
        title: '🔁 场景3.1 · 劲爆反转',
        newsTitle: '劲爆的反转！反转时吸引更多观众',
        pool: [
          { kernel: 1, label: '📈 +1 利好经济', class: 'positive' },
          { kernel: -99, label: '💥 -99 惊天负面', class: 'negative' }
        ],
        totalSteps: null,
        waterEnabled: true,
        useDragZones: true,
        intervalMs: 2,
        modeType: 'composite_dynamic',
        getProb: (mode, step, totalSteps) => {
          if (mode === 'simul') return Math.random() < 0.01;
          if (mode === 'posFirst') {
            if (step <= 250) return true;
            return Math.random() < 0.01;
          }
          if (mode === 'negFirst') {
            if (step <= 250) return false;
            return Math.random() < 0.01;
          }
        },
        getTotalSteps: (mode) => mode === 'posFirst' ? 1000 : 500
      },
      scene4: {
        title: '🔥 场景4 · 双新闻独立/同时发布',
        pool: [
          { kernel: -1, label: '📉 -1 负面新闻', class: 'negative' },
          { kernel: 9, label: '📈 +9 正面新闻', class: 'positive' }
        ],
        totalSteps: 500,
        waterEnabled: false,
        useDragZones: false,
        intervalMs: 10,
        modeType: 'dual'
      }
    };

    let currentScene = 'scene1';
    let publishedKernel = null;
    let simulationRunning = false;
    let intervalId = null;
    let step = 0;
    let totalSteps = 50;
    let approve = 0, oppose = 0;
    let approveA = 0, opposeA = 0, approveB = 0, opposeB = 0;
    let barChart = null, lineChart = null, barChart2 = null;
    let stepLabels = [];
    let opinionAHistory = [], opinionBHistory = [];

    const appRoot = document.getElementById('appRoot');

    function destroyAllCharts() {
      if (barChart) { barChart.destroy(); barChart = null; }
      if (lineChart) { lineChart.destroy(); lineChart = null; }
      if (barChart2) { barChart2.destroy(); barChart2 = null; }
    }

    function initCharts() {
      const scene = scenes[currentScene];
      let yMax = scene.totalSteps || 500;
      const barOptions = {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, max: yMax, ticks: { callback: (v) => v } } }
      };
      const lineOptions = {
        responsive: true, maintainAspectRatio: false,
        plugins: { tooltip: { mode: 'index' }, annotation: { annotations: {} } },
        scales: {
          x: { title: { display: false } },
          y: { title: { display: false }, beginAtZero: true, max: yMax }
        }
      };

      if (scene.modeType === 'dual') {
        const ctxA = document.getElementById('barChartA').getContext('2d');
        barChart = new Chart(ctxA, {
          type: 'bar',
          data: {
            labels: ['👍 赞同', '👎 反对', '📊 舆论值'],
            datasets: [{
              data: [0, 0, 0],
              backgroundColor: ['rgba(46,204,113,0.7)','rgba(231,76,60,0.7)','rgba(52,152,219,0.8)'],
              borderColor: ['#2ecc71','#e74c3c','#3498db'],
              borderWidth: 2, borderRadius: 8
            }]
          }, options: barOptions
        });
        const ctxB = document.getElementById('barChartB').getContext('2d');
        barChart2 = new Chart(ctxB, {
          type: 'bar',
          data: {
            labels: ['👍 赞同', '👎 反对', '📊 舆论值'],
            datasets: [{
              data: [0, 0, 0],
              backgroundColor: ['rgba(46,204,113,0.7)','rgba(231,76,60,0.7)','rgba(52,152,219,0.8)'],
              borderColor: ['#2ecc71','#e74c3c','#3498db'],
              borderWidth: 2, borderRadius: 8
            }]
          }, options: barOptions
        });
      } else {
        const barCtx = document.getElementById('barChart').getContext('2d');
        barChart = new Chart(barCtx, {
          type: 'bar',
          data: {
            labels: ['👍 赞同', '👎 反对', '📊 舆论值'],
            datasets: [{
              data: [0, 0, 0],
              backgroundColor: ['rgba(46,204,113,0.7)','rgba(231,76,60,0.7)','rgba(52,152,219,0.8)'],
              borderColor: ['#2ecc71','#e74c3c','#3498db'],
              borderWidth: 2, borderRadius: 8
            }]
          }, options: barOptions
        });
      }

      const lineCtx = document.getElementById('lineChart').getContext('2d');
      const datasets = [];
      if (scene.modeType === 'dual') {
        datasets.push(
          { label: '新闻A (-1) 舆论', data: [], borderColor: '#e74c3c', tension: 0.3, pointRadius: 0, fill: false },
          { label: '新闻B (+9) 舆论', data: [], borderColor: '#2ecc71', tension: 0.3, pointRadius: 0, fill: false }
        );
      } else {
        datasets.push(
          { label: '👍 赞同', data: [], borderColor: '#2ecc71', tension: 0.3, pointRadius: 0, fill: false },
          { label: '👎 反对', data: [], borderColor: '#e74c3c', tension: 0.3, pointRadius: 0, fill: false },
          { label: '📊 舆论值', data: [], borderColor: '#4f8cff', tension: 0.3, pointRadius: 0, fill: false }
        );
      }
      lineChart = new Chart(lineCtx, { type: 'line', data: { labels: [], datasets }, options: lineOptions });
    }

    function addVerticalLine(xValue, label) {
      if (!lineChart) return;
      const annotations = lineChart.options.plugins.annotation.annotations;
      const id = 'line_' + xValue;
      annotations[id] = {
        type: 'line',
        xMin: xValue,
        xMax: xValue,
        borderColor: '#f0c040',
        borderWidth: 2,
        borderDash: [4, 4],
        label: { content: label, display: true, position: 'start', backgroundColor: 'rgba(0,0,0,0.7)', color: '#fff' }
      };
      lineChart.update();
    }

    function resetState() {
      stopSimulation();
      publishedKernel = null;
      step = 0; approve = 0; oppose = 0;
      approveA = 0; opposeA = 0; approveB = 0; opposeB = 0;
      stepLabels = [];
      opinionAHistory = []; opinionBHistory = [];
      const pool = document.getElementById('newsPool');
      if (pool) {
        document.querySelectorAll('.drop-zone .news-card').forEach(card => pool.appendChild(card));
        const display = document.getElementById('currentNewsDisplay');
        if (display) { display.style.display = 'none'; display.textContent = ''; }
      }
      document.querySelectorAll('.news-card').forEach(c => c.draggable = true);
      document.getElementById('publishBtn').disabled = false;
      const waterBtn = document.getElementById('waterBtn');
      if (waterBtn) waterBtn.disabled = true;
    }

    function stopSimulation() {
      if (intervalId) clearInterval(intervalId);
      intervalId = null;
      simulationRunning = false;
    }

    function startSimulation() {
      const scene = scenes[currentScene];
      if (simulationRunning) return;

      if (scene.modeType === 'single') {
        if (publishedKernel === null) { alert('请先将新闻拖入发布区'); return; }
      } else if (scene.modeType === 'composite' || scene.modeType === 'composite_dynamic') {
        const rightCards = document.querySelectorAll('#zoneRight .news-card').length;
        const topCards = document.querySelectorAll('#zoneTop .news-card').length;
        const bottomCards = document.querySelectorAll('#zoneBottom .news-card').length;
        if (rightCards === 2) { /* ok */ }
        else if (topCards === 1 && bottomCards === 1) { /* ok */ }
        else { alert('请将两个内核都放入：同时发布区(2个) 或 先/后发布区(各1个)'); return; }
      } else if (scene.modeType === 'dual') {
        const a = document.querySelectorAll('#slotA .news-card').length;
        const b = document.querySelectorAll('#slotB .news-card').length;
        if (a + b === 0) { alert('请至少拖入一个新闻'); return; }
      }

      simulationRunning = true;
      document.getElementById('publishBtn').disabled = true;
      document.querySelectorAll('.news-card').forEach(c => c.draggable = false);
      const waterBtn = document.getElementById('waterBtn');
      if (waterBtn && scene.waterEnabled) waterBtn.disabled = false;

      step = 0;
      approve = 0; oppose = 0;
      approveA = 0; opposeA = 0; approveB = 0; opposeB = 0;
      stepLabels = [];
      const approveHist = [], opposeHist = [], opinionHist = [];
      opinionAHistory = []; opinionBHistory = [];

      let mode = null;
      if (scene.modeType === 'composite' || scene.modeType === 'composite_dynamic') {
        if (document.querySelectorAll('#zoneRight .news-card').length === 2) {
          mode = 'simul';
        } else {
          const topKernel = document.querySelector('#zoneTop .news-card')?.dataset.kernel;
          mode = (topKernel === '1') ? 'posFirst' : 'negFirst';
        }
      }

      if (scene.modeType === 'composite_dynamic') {
        totalSteps = scene.getTotalSteps(mode);
      } else {
        totalSteps = scene.totalSteps;
      }

      const intervalMs = scene.intervalMs;

      intervalId = setInterval(() => {
        step++;
        if (step > totalSteps) {
          stopSimulation();
          if (waterBtn) waterBtn.disabled = true;
          document.getElementById('publishBtn').disabled = false;
          return;
        }

        if (scene.modeType === 'single') {
          const res = scene.evaluate(publishedKernel);
          approve += res.approve;
          oppose += res.oppose;
          stepLabels.push(step + '');
          approveHist.push(approve); opposeHist.push(oppose);
          opinionHist.push(approve - oppose);
          barChart.data.datasets[0].data = [approve, oppose, approve - oppose];
          barChart.update();
          lineChart.data.labels = stepLabels;
          lineChart.data.datasets[0].data = approveHist;
          lineChart.data.datasets[1].data = opposeHist;
          lineChart.data.datasets[2].data = opinionHist;
          lineChart.update();
        }
        else if (scene.modeType === 'composite' || scene.modeType === 'composite_dynamic') {
          let isApprove = false;
          if (scene.modeType === 'composite') {
            isApprove = scene.getProb(mode, step);
          } else {
            isApprove = scene.getProb(mode, step, totalSteps);
          }
          if (isApprove) { approve++; } else { oppose++; }
          stepLabels.push(step + '');
          approveHist.push(approve); opposeHist.push(oppose);
          opinionHist.push(approve - oppose);
          barChart.data.datasets[0].data = [approve, oppose, approve - oppose];
          barChart.update();
          lineChart.data.labels = stepLabels;
          lineChart.data.datasets[0].data = approveHist;
          lineChart.data.datasets[1].data = opposeHist;
          lineChart.data.datasets[2].data = opinionHist;
          lineChart.update();

          // 只在顺序发布时添加竖线
          if ((mode === 'posFirst' || mode === 'negFirst') && step === 250) {
            addVerticalLine(stepLabels.length - 1, '反转点');
          }
        }
        else if (scene.modeType === 'dual') {
          const hasA = document.querySelectorAll('#slotA .news-card').length > 0;
          const hasB = document.querySelectorAll('#slotB .news-card').length > 0;
          let resA = { approve: 0, oppose: 0 };
          let resB = { approve: 0, oppose: 0 };
          if (hasA && hasB) {
            if (step < 100) {
              resA = { approve: 0, oppose: 1 };
            } else {
              if (Math.random() < 0.1) {
                resA = { approve: 0, oppose: 1 };
              } else {
                resB = { approve: 1, oppose: 0 };
              }
            }
          } else if (hasA) {
            resA = { approve: 0, oppose: 1 };
          } else if (hasB) {
            resB = { approve: 1, oppose: 0 };
          }
          approveA += resA.approve; opposeA += resA.oppose;
          approveB += resB.approve; opposeB += resB.oppose;
          stepLabels.push(step + '');
          opinionAHistory.push(approveA - opposeA);
          opinionBHistory.push(approveB - opposeB);
          barChart.data.datasets[0].data = [approveA, opposeA, approveA - opposeA];
          barChart.update();
          if (barChart2) {
            barChart2.data.datasets[0].data = [approveB, opposeB, approveB - opposeB];
            barChart2.update();
          }
          lineChart.data.labels = stepLabels;
          lineChart.data.datasets[0].data = opinionAHistory;
          lineChart.data.datasets[1].data = opinionBHistory;
          lineChart.update();
          if (step === 100 && hasA && hasB) {
            addVerticalLine(stepLabels.length - 1, '正面新闻发布');
          }
        }
      }, intervalMs);
    }

    function bindEvents() {
      const scene = scenes[currentScene];
      document.querySelectorAll('.news-card').forEach(card => {
        card.addEventListener('dragstart', (e) => {
          if (simulationRunning) return;
          e.dataTransfer.setData('text/plain', JSON.stringify({ kernel: parseInt(card.dataset.kernel), id: card.id }));
          card.classList.add('dragging');
        });
        card.addEventListener('dragend', () => card.classList.remove('dragging'));
      });

      if (scene.modeType === 'single') {
        const zone = document.getElementById('publishZone');
        zone.addEventListener('dragover', e => { e.preventDefault(); if (!simulationRunning) zone.classList.add('drag-over'); });
        zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
        zone.addEventListener('drop', e => {
          e.preventDefault();
          zone.classList.remove('drag-over');
          if (simulationRunning) return;
          const data = JSON.parse(e.dataTransfer.getData('text/plain'));
          publishedKernel = data.kernel;
          const card = document.getElementById(data.id);
          zone.querySelectorAll('.news-card').forEach(c => document.getElementById('newsPool').appendChild(c));
          zone.appendChild(card);
          const display = document.getElementById('currentNewsDisplay');
          display.textContent = card.textContent;
          display.style.display = 'block';
          display.className = `news-card ${card.classList.contains('positive')?'positive':card.classList.contains('negative')?'negative':'neutral'}`;
        });
      } else if (scene.modeType === 'composite' || scene.modeType === 'composite_dynamic') {
        ['zoneTop','zoneBottom','zoneRight'].forEach(zoneId => {
          const zone = document.getElementById(zoneId);
          zone.addEventListener('dragover', e => { e.preventDefault(); if (!simulationRunning) zone.classList.add('drag-over'); });
          zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
          zone.addEventListener('drop', e => {
            e.preventDefault();
            zone.classList.remove('drag-over');
            if (simulationRunning) return;
            const data = JSON.parse(e.dataTransfer.getData('text/plain'));
            const card = document.getElementById(data.id);
            if (!card) return;
            ['zoneTop','zoneBottom','zoneRight'].forEach(id => {
              if (id === zoneId) return;
              const other = document.getElementById(id);
              if (other && other.contains(card)) other.removeChild(card);
            });
            const max = zoneId === 'zoneRight' ? 2 : 1;
            if (zone.querySelectorAll('.news-card').length >= max) {
              const extra = zone.querySelector('.news-card');
              if (extra) document.getElementById('newsPool').appendChild(extra);
            }
            zone.appendChild(card);
          });
        });
      } else if (scene.modeType === 'dual') {
        ['slotA','slotB'].forEach(zoneId => {
          const zone = document.getElementById(zoneId);
          zone.addEventListener('dragover', e => { e.preventDefault(); if (!simulationRunning) zone.classList.add('drag-over'); });
          zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
          zone.addEventListener('drop', e => {
            e.preventDefault();
            zone.classList.remove('drag-over');
            if (simulationRunning) return;
            const data = JSON.parse(e.dataTransfer.getData('text/plain'));
            const card = document.getElementById(data.id);
            if (!card) return;
            const otherZoneId = zoneId === 'slotA' ? 'slotB' : 'slotA';
            const otherZone = document.getElementById(otherZoneId);
            if (otherZone && otherZone.contains(card)) otherZone.removeChild(card);
            if (zone.querySelectorAll('.news-card').length >= 1) {
              const extra = zone.querySelector('.news-card');
              if (extra) document.getElementById('newsPool').appendChild(extra);
            }
            zone.appendChild(card);
          });
        });
      }

      document.getElementById('publishBtn').addEventListener('click', startSimulation);
      document.getElementById('resetBtn').addEventListener('click', resetState);
      const waterBtn = document.getElementById('waterBtn');
      if (waterBtn) {
        waterBtn.addEventListener('click', () => {
          if (!simulationRunning || step >= totalSteps) return;
          approve += 2;
          barChart.data.datasets[0].data = [approve, oppose, approve - oppose];
          barChart.update();
        });
      }

      document.querySelectorAll('.scene-nav button').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.scene;
          if (key === currentScene) return;
          currentScene = key;
          stopSimulation();
          destroyAllCharts();
          renderScene();
        });
      });
    }

    function renderScene() {
      const scene = scenes[currentScene];
      totalSteps = scene.totalSteps || 500;
      
      // 获取规则说明区域
      const rulesSection = document.querySelector('.rules-section');
      
      // 创建主内容区域
      const mainContent = document.createElement('div');
      mainContent.innerHTML = `
        <div class="header">
          <span class="logo-icon">📰</span><h1>新闻模拟器</h1>
          <div class="scene-nav">
            <button class="${currentScene==='scene1'?'active':''}" data-scene="scene1">场景1</button>
            <button class="${currentScene==='scene2'?'active':''}" data-scene="scene2">场景2</button>
            <button class="${currentScene==='scene3'?'active':''}" data-scene="scene3">场景3</button>
            <button class="${currentScene==='scene3_1'?'active':''}" data-scene="scene3_1">场景3.1</button>
            <button class="${currentScene==='scene4'?'active':''}" data-scene="scene4">场景4</button>
          </div>
        </div>
        <div class="workspace">
          <div class="pool">
            <div class="pool-label">📋 ${scene.newsTitle || '待发布新闻'}</div>
            <div class="news-cards" id="newsPool">
              ${scene.pool.map((n,i) => `<div class="news-card ${n.class}" draggable="true" data-kernel="${n.kernel}" id="newsItem${i}">${n.label}</div>`).join('')}
            </div>
          </div>
          ${scene.modeType==='composite' || scene.modeType==='composite_dynamic' ? `
            <div class="publish-area">
              <div class="slot-row">
                <div class="drop-zone" id="zoneTop"><span class="zone-label">⬆️ 先发布</span></div>
                <div class="drop-zone" id="zoneBottom"><span class="zone-label">⬇️ 后发布</span></div>
              </div>
              <div class="drop-zone" id="zoneRight"><span class="zone-label">⏺️ 同时发布</span></div>
            </div>
          ` : (scene.modeType==='dual' ? `
            <div class="publish-area">
              <div class="slot-row">
                <div class="drop-zone" id="slotA"><span class="zone-label">📌 新闻A (-1)</span></div>
                <div class="drop-zone" id="slotB"><span class="zone-label">📌 新闻B (+9)</span></div>
              </div>
            </div>
          ` : `
            <div class="drop-zone" id="publishZone" style="flex:1;"><span class="zone-label">📌 将新闻拖入此处</span><div id="currentNewsDisplay" style="display:none;" class="news-card"></div></div>
          `)}
        </div>
        <div class="action-btns">
          <button class="btn btn-primary" id="publishBtn">🚀 发布新闻</button>
          ${scene.waterEnabled ? '<button class="btn btn-water" id="waterBtn" disabled>💧 请水军 (+2赞同)</button>' : ''}
          <button class="btn" id="resetBtn">🔄 重置</button>
        </div>
        ${scene.modeType==='dual' ? `
        <div class="dual-bar">
          <div class="chart-box"><canvas id="barChartA"></canvas></div>
          <div class="chart-box"><canvas id="barChartB"></canvas></div>
        </div>
        ` : `<div class="charts-row"><div class="chart-box"><canvas id="barChart"></canvas></div></div>`}
        <div class="charts-row"><div class="chart-box"><canvas id="lineChart"></canvas></div></div>
      `;
      
      // 清空appRoot，但保留规则说明区域
      appRoot.innerHTML = '';
      if (rulesSection) {
        appRoot.appendChild(rulesSection);
      } else {
        // 如果规则说明区域不存在，重新创建
        appRoot.innerHTML = `
          <div class="rules-section">
            <div class="rules-title">📋 模拟器规则说明</div>
            <div class="rules-content">
              <ul class="rules-list">
                <li>一个新闻有一个或多个<strong class="rules-highlight">要点(kernel)</strong>，值为<strong class="rules-highlight">负(-)</strong>、<strong class="rules-highlight">正(+)</strong>或<strong class="rules-highlight">零(0)</strong></li>
                <li>观众遇到要点为<strong class="rules-highlight">正</strong>的新闻就会<strong class="rules-highlight">点赞</strong></li>
                <li>观众遇到要点为<strong class="rules-highlight">负</strong>的新闻就会<strong class="rules-highlight">点踩</strong></li>
                <li>观众遇到要点为<strong class="rules-highlight">0</strong>的新闻有<strong class="rules-highlight">0.5</strong>的概率点赞，<strong class="rules-highlight">0.5</strong>的概率点踩</li>
                <li>要点的<strong class="rules-highlight">绝对值</strong>代表新闻的吸引程度</li>
              </ul>
              
              <div class="rules-formula">
                双新闻选择概率公式：<br>
                新闻A要点绝对值 = a，新闻B要点绝对值 = b<br>
                观众有 a/(a+b) 的概率评论新闻A，b/(a+b) 的概率评论新闻B
              </div>
              
              <div class="rules-formula">
                复合新闻反应概率公式：<br>
                新闻有正要点(绝对值a)和负要点(绝对值b)<br>
                观众评论新闻时有 a/(a+b) 的概率点赞，b/(a+b) 的概率点踩
              </div>
            </div>
          </div>
        `;
      }
      
      // 添加主内容
      appRoot.appendChild(mainContent);
      
      initCharts();
      resetState();
      bindEvents();
    }

    // 初始渲染
    renderScene();
  })();
</script>
</body>
</html>
